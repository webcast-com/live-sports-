<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>ScoreHub - Live Sports Scores, Highlights & Standings | NFL, NBA, Soccer, MLB</title>
    <meta name="title" content="ScoreHub - Live Sports Scores, Highlights & Standings | NFL, NBA, Soccer, MLB" />
    <meta name="description" content="Get instant live scores, match highlights, league standings, and real-time updates for NFL, NBA, Premier League, MLB, La Liga, and more. ScoreHub is your ultimate live sports hub." />
    <meta name="keywords" content="live scores, sports scores, NFL, NBA, Premier League, MLS, La Liga, Serie A, Bundesliga, MLB, tennis, soccer, football, basketball, live match, standings, top scorers, transfers, sports news" />
    <meta name="author" content="ScoreHub" />
    <meta name="application-name" content="ScoreHub" />
    <link rel="canonical" href="https://livescoresgames.netlify.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <!-- Theme -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="msapplication-TileColor" content="#0d1117" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://vgofxfjbcaplgrhodxmn.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://api.codetabs.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://livescoresgames.netlify.app/" />
    <meta property="og:title" content="ScoreHub - Live Sports Scores, Highlights & Standings" />
    <meta property="og:description" content="Get instant live scores, match highlights, league standings, and real-time updates for all major sports leagues worldwide." />
    <meta property="og:image" content="https://livescoresgames.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ScoreHub" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://livescoresgames.netlify.app/" />
    <meta name="twitter:title" content="ScoreHub - Live Sports Scores, Highlights & Standings" />
    <meta name="twitter:description" content="Get instant live scores, match highlights, league standings, and real-time updates for all major sports leagues worldwide." />
    <meta name="twitter:image" content="https://livescoresgames.netlify.app/og-image.png" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsOrganization",
        "name": "ScoreHub",
        "url": "https://livescoresgames.netlify.app/",
        "logo": "https://livescoresgames.netlify.app/favicon.svg",
        "description": "Your ultimate destination for live sports scores, stats, and breaking news.",
        "sameAs": ["https://twitter.com/", "https://youtube.com/", "https://instagram.com/", "https://facebook.com/"]
      }
    </script>
    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ScoreHub",
        "url": "https://livescoresgames.netlify.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://livescoresgames.netlify.app/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
